<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GT Booking{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --gt-green-950: #052e16;
      --gt-green-900: #14532d;
      --gt-green-800: #166534;
      --gt-green-700: #15803d;
      --gt-green-600: #16a34a;
      --gt-green-500: #22c55e;
      --gt-mint-100: #d1fae5;
      --gt-mint-50: #ecfdf5;
      --bs-primary: #0f766e;
      --bs-primary-rgb: 15, 118, 110;
      --bs-success: #15803d;
      --bs-success-rgb: 21, 128, 61;
      --bs-link-color: #0d9488;
      --bs-link-hover-color: #0f766e;
    }

    body.gt-theme {
      min-height: 100vh;
      color: var(--gt-green-900);
      background: linear-gradient(
        165deg,
        #ecfdf5 0%,
        #f0fdf4 35%,
        #f8fafc 100%
      );
    }

    .navbar-gt {
      background: linear-gradient(
        120deg,
        var(--gt-green-950) 0%,
        #064e3b 38%,
        #047857 100%
      ) !important;
      box-shadow: 0 4px 20px rgba(5, 46, 22, 0.35);
    }

    .navbar-gt .navbar-brand {
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ecfdf5 !important;
    }

    .navbar-gt .nav-link {
      color: rgba(236, 253, 245, 0.92) !important;
      font-weight: 500;
    }

    .navbar-gt .nav-link:hover {
      color: #a7f3d0 !important;
    }

    .navbar-gt .navbar-text {
      color: rgba(167, 243, 208, 0.85) !important;
    }

    .gt-shell {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(16, 185, 129, 0.22);
      border-radius: 1rem;
      box-shadow: 0 12px 40px rgba(6, 78, 59, 0.08);
      padding: 1.5rem 1.75rem;
    }

    @media (min-width: 768px) {
      .gt-shell {
        padding: 2rem 2.25rem;
      }
    }

    .gt-heading {
      color: var(--gt-green-900);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .gt-lead {
      color: #166534;
    }

    .gt-link {
      color: #0f766e !important;
      font-weight: 500;
    }

    .gt-link:hover {
      color: #115e59 !important;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #34d399;
      box-shadow: 0 0 0 0.22rem rgba(52, 211, 153, 0.28);
    }

    .list-group-item {
      border-color: rgba(16, 185, 129, 0.18);
    }

    .list-group-item:hover {
      background-color: rgba(236, 253, 245, 0.65);
    }

    .table-gt thead th {
      background: linear-gradient(180deg, #d1fae5 0%, #ecfdf5 100%);
      color: var(--gt-green-900);
      font-weight: 600;
      border-bottom: 2px solid rgba(52, 211, 153, 0.45);
    }

    .table-gt tbody tr:hover {
      background-color: rgba(240, 253, 244, 0.55);
    }

    .pagination .page-link {
      color: var(--bs-primary);
    }

    .pagination .page-item.active .page-link {
      background-color: var(--bs-primary);
      border-color: var(--bs-primary);
    }

    .btn-primary {
      --bs-btn-bg: #0f766e;
      --bs-btn-border-color: #0d9488;
      --bs-btn-hover-bg: #0d9488;
      --bs-btn-hover-border-color: #14b8a6;
      --bs-btn-active-bg: #115e59;
      --bs-btn-active-border-color: #0f766e;
    }

    .btn-outline-success {
      --bs-btn-color: #15803d;
      --bs-btn-border-color: #34d399;
      --bs-btn-hover-bg: #ecfdf5;
      --bs-btn-hover-border-color: #10b981;
      --bs-btn-hover-color: #14532d;
    }

    .alert-info {
      --bs-alert-bg: #ecfdf5;
      --bs-alert-border-color: rgba(52, 211, 153, 0.45);
      --bs-alert-color: #14532d;
    }
  </style>
</head>
<body class="gt-theme">
<nav class="navbar navbar-expand-lg navbar-dark navbar-gt mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'core:home' %}">GT Booking</a>
    <div class="navbar-nav ms-auto flex-row flex-wrap gap-2 gap-lg-3 align-items-center justify-content-end">
      {% if user.is_authenticated %}
        <span class="navbar-text small">{{ user.username }}</span>
        <a class="nav-link py-0" href="{% url 'accounts:logout' %}">Esci</a>
      {% else %}
        <a class="nav-link py-0" href="{% url 'accounts:login' %}">Accedi</a>
        <a class="nav-link py-0" href="{% url 'accounts:register' %}">Registrati</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container pb-5 px-3">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
  <div class="gt-shell">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
